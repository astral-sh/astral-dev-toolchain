name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  toolchain-test:
    name: Toolchain test
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test.yml

  security-review:
    name: Security review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # The automations STS policy must authorize this exact workflow SHA.
    uses: astral-sh/github-actions/.github/workflows/pull-request-security-review.yml@f11dbff15181b71f2cc5e8487b1ac7d7bb03ea7d
    with:
      uv-version: "0.13.4"
      uv-checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
      setup-command: uv sync --frozen --all-packages
    # Required for automations environment secrets; the pinned workflow does
    # not declare named workflow_call secrets. Only same-repository PRs run.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Check lint
        run: uv run --no-sync ruff check

      - name: Check formatting
        run: uv run --no-sync ruff format --check

      - name: Check types
        run: uv run --no-sync ty check

      - name: Unit tests
        run: uv run --no-sync pytest
