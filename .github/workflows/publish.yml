name: Publish

on:
  workflow_dispatch:
    inputs:
      tools:
        description: "Tools to publish (comma-separated tool.name values from build.toml)"
        required: true
        type: string
      dry_run:
        description: "Validate the distributions without uploading them to PyPI"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build tools
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/toolchain-build.yml
    with:
      select: ${{ inputs.tools }}

  publish:
    name: Publish tools
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: toolchain-*
          path: toolchain-dist
          merge-multiple: true

      - name: Dry-run wheel publish
        if: inputs.dry_run
        run: uv publish --dry-run toolchain-dist/*

      - name: Publish wheels to PyPI
        if: ${{ !inputs.dry_run }}
        run: uv publish toolchain-dist/*
