name: Toolchain build

on:
  workflow_call:
    inputs:
      select:
        description: "Tools to build (comma-separated tool.name values from build.toml)"
        required: false
        type: string
    outputs:
      tools:
        description: "Selected tool.name values as a JSON array"
        value: ${{ jobs.select.outputs.tools }}
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool to build (tool.name from build.toml, e.g. cargo-hack)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  select:
    name: Select tools
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tools: ${{ steps.select.outputs.tools }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Select tools
        id: select
        env:
          SELECT: ${{ inputs.select }}
        run: uv run --locked python scripts/ci-select-tools.py

  build:
    name: Build ${{ matrix.tool }}
    needs: select
    if: needs.select.outputs.tools != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.select.outputs.tools) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tool
        env:
          TOOL: ${{ matrix.tool }}
        run: uv run --locked astral-dev-toolchain build --select "$TOOL"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-${{ matrix.tool }}
          path: toolchain-dist/*.whl
          if-no-files-found: error

      - name: Stop remaining build containers
        if: always()
        run: |
          docker ps --quiet --filter label=org.astral-sh.astral-dev-toolchain.invocation \
            | xargs --no-run-if-empty docker stop --timeout 10
          test -z "$(docker ps --quiet --filter label=org.astral-sh.astral-dev-toolchain.invocation)"
