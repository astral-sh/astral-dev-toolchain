name: Toolchain build

on:
  workflow_call:
    inputs:
      select:
        description: "Tools to build (comma-separated tool.name values from build.toml)"
        required: false
        type: string
    outputs:
      tools:
        description: "Selected tool.name values as a JSON array"
        value: ${{ jobs.select.outputs.tools }}
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool to build (tool.name from build.toml, e.g. cargo-hack)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  select:
    name: Select tools
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tools: ${{ steps.select.outputs.tools }}
      matrix: ${{ steps.select.outputs.matrix }}
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Select tools
        id: select
        env:
          SELECT: ${{ inputs.select }}
        run: uv run --locked python scripts/ci-select-tools.py

  build:
    name: Build ${{ matrix.tool }}
    needs: select
    if: needs.select.outputs.tools != '[]'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    uses: ./.github/workflows/toolchain-tool.yml
    with:
      tool: ${{ matrix.tool }}
      targets: ${{ needs.select.outputs.targets }}
      shard-targets: ${{ matrix.shard }}
