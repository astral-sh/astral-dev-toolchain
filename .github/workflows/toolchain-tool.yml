name: Toolchain tool

on:
  workflow_call:
    inputs:
      tool:
        description: "Tool to build (tool.name from build.toml)"
        required: true
        type: string
      hello-world:
        description: "Build and test the CI examples instead of a published tool"
        type: boolean
        default: false
      targets:
        description: "JSON array of image targets and their native smoke-test runners"
        required: true
        type: string
      smoke:
        description: "Run the tool's smoke tests on every native target"
        required: false
        default: false
        type: boolean
      shard-targets:
        description: "Build each target in a separate job"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.tool }}${{ matrix.target && format(' ({0})', matrix.target) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.shard-targets && inputs.targets || '[{"target":""}]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Rust and Go examples
        if: inputs.hello-world
        run: bash scripts/ci-build-hello.sh

      - name: Build tool
        if: ${{ !inputs.hello-world }}
        env:
          TOOL: ${{ inputs.tool }}
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [[ -n "$TARGET" ]]; then
            args+=(--target "$TARGET")
          fi
          uv run --locked astral-dev-toolchain build --select "$TOOL" "${args[@]}"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-${{ inputs.tool }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: toolchain-dist/*.whl
          if-no-files-found: error

  smoke:
    name: Test ${{ inputs.tool }} on ${{ matrix.target }}
    needs: build
    if: inputs.smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    steps:
      - if: runner.os == 'macOS'
        uses: astral-sh/github-actions/demudhra@67dc9ee1ddc113eccd8116e7b949fb6cdcd89889 # 2026.11.16.0
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolchain-${{ inputs.tool }}${{ inputs.shard-targets && format('-{0}', matrix.target) || '' }}
          path: toolchain-dist

      - name: Run Rust and Go examples
        if: inputs.hello-world
        shell: bash
        run: |
          for tool in hello-rust hello-go; do
            greeting=$(uv tool run --isolated --offline --no-index --no-cache --no-config \
              --find-links toolchain-dist --from "astral-dev-toolchain-$tool" "$tool")
            echo "$tool: $greeting"
            [[ "$greeting" == "Hello, world!" ]]
          done

      - name: Test wheels
        if: ${{ !inputs.hello-world }}
        env:
          ASTRAL_DEV_TOOLCHAIN_TEST_SELECT: ${{ format('[{0}]', toJSON(inputs.tool)) }}
        run: uv run --locked astral-dev-toolchain test --dist-dir toolchain-dist
