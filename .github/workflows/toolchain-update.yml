name: Toolchain update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview updates without changing definitions, branches, or PRs"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: toolchain-update
  cancel-in-progress: false

jobs:
  update:
    name: Update tools
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      id-token: write # for the credential broker
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Get updater token
        id: token
        if: ${{ !inputs.dry_run }}
        # STS must authorize toolchain-update.yml on main for schedule/dispatch.
        uses: astral-sh/github-actions/simple-token-service@eb81cf4d13127c3f9539f621c17e4c65327636c8
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: ${{ github.repository }}
          permissions: |
            contents: write
            pull_requests: write

      - name: Discover updates and open PRs
        env:
          GH_TOKEN: ${{ inputs.dry_run && github.token || steps.token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          uv run --locked python scripts/ci-update-tools.py "${args[@]}"
