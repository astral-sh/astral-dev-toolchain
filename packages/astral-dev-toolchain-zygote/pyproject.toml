[project]
name = "astral-dev-toolchain-zygote"
version = "0.1.0"
description = "Container-side builder for the Astral development toolchain"
authors = [{ name = "William Woodruff", email = "william@yossarian.net" }]
requires-python = ">=3.14"
dependencies = [
    "astral-dev-toolchain-core",
    "go-to-wheel==0.2",
    "maturin>=1.14.1",
    "packaging>=26.3",
    "tomli-w>=1.2.0",
    "ziglang>=0.16.0",
]

[tool.uv.sources]
astral-dev-toolchain-core = { workspace = true }

[project.scripts]
astral-dev-toolchain-zygote = "astral_dev_toolchain_zygote:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
