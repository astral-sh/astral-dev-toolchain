[project]
name = "astral-dev-toolchain"
version = "0.1.0"
description = "A CLI to manage and build tools within Astral's development toolchain"
authors = [{ name = "William Woodruff", email = "william@yossarian.net" }]
requires-python = ">=3.14"
dependencies = [
    "astral-dev-toolchain-core",
    "packaging>=26.3",
    "tomlkit>=0.13.3",
]

[tool.uv.sources]
astral-dev-toolchain-core = { workspace = true }

[project.scripts]
astral-dev-toolchain = "astral_dev_toolchain:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
