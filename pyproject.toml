[project]
name = "astral-dev-toolchain-workspace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["astral-dev-toolchain"]

[tool.uv]
exclude-newer = "P7D"
package = false

[tool.uv.sources]
astral-dev-toolchain = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.71",
]
