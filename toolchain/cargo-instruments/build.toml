version = 1

[tool]
backend = "rust"
name = "cargo-instruments"
# Vendor OpenSSL and libgit2, and use macOS's system libcurl to avoid
# curl-sys's Clang runtime lookup when cross-compiling with Zig.
features = ["cargo/all-static"]
repo = "https://github.com/cmyr/cargo-instruments"

[[source]]
tag = "v0.4.18"
commit = "be7998fb9fde111deb34c7ceb1e5ba7bc0f86d6b"
first-seen = 2026-10-23T06:46:50.340989Z

[ci]
# cargo-instruments requires macOS and Xcode Instruments.
exclude-targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]

[[test]]
name = "help"
run = ["cargo-instruments", "instruments", "--help"]
