version = 1

[tool]
backend = "rust"
name = "cargo-instruments"
# Vendor OpenSSL and libgit2, and use macOS's system libcurl to avoid
# curl-sys's Clang runtime lookup when cross-compiling with Zig.
features = ["cargo/all-static"]

[tool.env]
# Zig emits duplicate libiconv load commands that macOS rejects at startup.
# Strip unused dylibs while preserving the bootstrap image's SDK search paths.
# See: https://github.com/rust-cross/cargo-zigbuild/pull/464
CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS = "-C link-arg=-F/app/macos-sdk/System/Library/Frameworks -C link-arg=-L/app/macos-sdk/usr/lib -C link-arg=-Wl,-dead_strip_dylibs"
CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS = "-C link-arg=-F/app/macos-sdk/System/Library/Frameworks -C link-arg=-L/app/macos-sdk/usr/lib -C link-arg=-Wl,-dead_strip_dylibs"

[source]
repo = "https://github.com/cmyr/cargo-instruments"
tag = "v0.4.18"
commit = "be7998fb9fde111deb34c7ceb1e5ba7bc0f86d6b"

[ci]
shard = true
# cargo-instruments requires macOS and Xcode Instruments.
exclude-targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]

[[test]]
name = "help"
run = ["cargo-instruments", "instruments", "--help"]

