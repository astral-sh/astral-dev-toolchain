version = 1

[tool]
backend = "rust"
name = "cargo-nextest"
manifest = "cargo-nextest/Cargo.toml"
# nextest enables usdt by default; usdt has a proc macro
# that generates assembly for the build host rather than the target.
# see: https://github.com/oxidecomputer/usdt/issues/459
no-default-features = true
repo = "https://github.com/nextest-rs/nextest"

