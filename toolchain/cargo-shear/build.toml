version = 1

[tool]
backend = "rust"
name = "cargo-shear"
# Match cargo-shear's upstream release builds, which use mimalloc.
features = ["allocator"]

[source]
repo = "https://github.com/Boshen/cargo-shear"
tag = "v1.13.4"
commit = "1fdd1d97b964162cc8142c2945e18e0a54cd0f92"

[[test]]
name = "help"
run = ["cargo-shear", "--help"]
