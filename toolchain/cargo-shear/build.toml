version = 1

[tool]
backend = "rust"
name = "cargo-shear"

[tool.env]
# Fat LTO produces Windows binaries that crash at startup when cross-linked.
CARGO_PROFILE_RELEASE_LTO = "false"

[source]
repo = "https://github.com/Boshen/cargo-shear"
tag = "v1.13.4"
commit = "1fdd1d97b964162cc8142c2945e18e0a54cd0f92"

[[test]]
name = "help"
run = ["cargo-shear", "--help"]
