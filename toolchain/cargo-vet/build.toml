version = 1

[tool]
backend = "rust"
name = "cargo-vet"

[source]
repo = "https://github.com/mozilla/cargo-vet"
tag = "v0.10.3"
commit = "cef4dd43a0b9d2d37febf0e5ad42abc6d9ea5472"

[ci]
shard = true
# ring 0.16.20 does not support Windows ARM64. cargo-vet's upgrade to ring 0.17
# is blocked on completing the corresponding supply-chain audits:
# https://github.com/mozilla/cargo-vet/pull/645
# Remove this exclusion once cargo-vet ships that upgrade.
exclude-targets = ["aarch64-pc-windows-msvc"]

[[test]]
name = "help"
run = ["cargo-vet", "--help"]

[update]
enabled = true

[update.observed."v0.10.3"]
commit = "cef4dd43a0b9d2d37febf0e5ad42abc6d9ea5472"
