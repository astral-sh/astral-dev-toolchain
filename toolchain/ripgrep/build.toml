version = 1

[tool]
backend = "rust"
name = "ripgrep"

[tool.env]
# Ripgrep enables release debuginfo, but the bootstrap image omits CRT PDBs.
# Disable it to avoid LNK4099 errors under ripgrep's MSVC /WX linker flag.
# https://github.com/BurntSushi/ripgrep/pull/3519
CARGO_PROFILE_RELEASE_DEBUG = "0"

[source]
repo = "https://github.com/BurntSushi/ripgrep"
tag = "15.2.0"
commit = "e89fff89ac9af12e8d4ce9d5fd07beb408ca730f"
